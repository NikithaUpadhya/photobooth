services:
  db:
    image: postgres:17
    container_name: photobooth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: photobooth
      POSTGRES_PASSWORD: photobooth
      POSTGRES_DB: photobooth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobooth -d photobooth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: